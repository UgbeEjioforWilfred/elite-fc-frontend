<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Edit Match</title>

    <link rel="stylesheet" href="../css/admin.css" />
  </head>

  <body>
    <header class="header">
      <h1>⚽ Edit Match</h1>
    </header>

    <main>
      <section class="welcome">
        <h2>Edit Fixture Details</h2>
      </section>

      <section>
        <label> Team A </label>

        <select id="teamA"></select>

        <label> Team B </label>

        <select id="teamB"></select>

        <label> Match Date & Time </label>

        <input type="datetime-local" id="matchDate" />

        <label> Round </label>

        <input type="text" id="round" />

        <button id="saveMatch">Save Changes</button>
      </section>
    </main>

    <script src="edit-match.js"></script>
  </body>
</html>
